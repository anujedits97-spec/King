name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform and build tools
        env:
          SDK: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Prepare release signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.MYRA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/myra.keystore"
            echo "MYRA_KEYSTORE=$RUNNER_TEMP/myra.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          MYRA_KEYSTORE_PASSWORD: ${{ secrets.MYRA_KEYSTORE_PASSWORD }}
          MYRA_KEY_ALIAS: ${{ secrets.MYRA_KEY_ALIAS }}
          MYRA_KEY_PASSWORD: ${{ secrets.MYRA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | grep -E 'release|debug' | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myra-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
